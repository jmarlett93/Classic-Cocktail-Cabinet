<div class="min-h-screen flex flex-col bg-surface text-ink">
  <header
    class="sticky top-0 z-10 border-b border-border bg-shell-header px-[max(1rem,env(safe-area-inset-left))] py-3 text-shell-ink backdrop-blur"
  >
    <div class="mx-auto flex max-w-shell flex-wrap items-center justify-between gap-3">
      <a routerLink="/welcome" class="group flex items-baseline gap-3 text-inherit no-underline">
        <span class="font-display text-[1.45rem] leading-none tracking-[-0.04em]">{{ title }}</span>
        <span class="hidden text-[0.68rem] font-black uppercase tracking-[0.16em] text-shell-ink-muted sm:inline">
          Drink · bottle · flavor
        </span>
      </a>
      <nav class="flex flex-wrap gap-1.5" aria-label="Main">
        <a
          routerLink="/welcome"
          routerLinkActive="!bg-nav-active-bg !border-nav-active-border !text-ink"
          [routerLinkActiveOptions]="{ exact: true }"
          class="inline-flex min-h-10 items-center rounded-full border border-transparent px-3 text-sm font-bold text-shell-ink-muted no-underline transition hover:bg-nav-hover hover:text-ink motion-reduce:transition-none"
        >
          Start
        </a>
        <a
          routerLink="/discover/drinks"
          routerLinkActive="!bg-nav-active-bg !border-nav-active-border !text-ink"
          class="inline-flex min-h-10 items-center rounded-full border border-transparent px-3 text-sm font-bold text-shell-ink-muted no-underline transition hover:bg-nav-hover hover:text-ink motion-reduce:transition-none"
        >
          Drinks
        </a>
        <a
          routerLink="/discover/bottles"
          routerLinkActive="!bg-nav-active-bg !border-nav-active-border !text-ink"
          class="inline-flex min-h-10 items-center rounded-full border border-transparent px-3 text-sm font-bold text-shell-ink-muted no-underline transition hover:bg-nav-hover hover:text-ink motion-reduce:transition-none"
        >
          Bottles
        </a>
        <a
          routerLink="/cabinet"
          routerLinkActive="!bg-nav-active-bg !border-nav-active-border !text-ink"
          class="inline-flex min-h-10 items-center rounded-full border border-transparent px-3 text-sm font-bold text-shell-ink-muted no-underline transition hover:bg-nav-hover hover:text-ink motion-reduce:transition-none"
        >
          Cabinet
        </a>
      </nav>
    </div>
  </header>

  <main class="flex-1 w-full">
    <router-outlet />
  </main>

  <footer class="border-t border-border bg-shell-footer px-[clamp(1.25rem,4vw,2.5rem)] py-5">
    <p class="m-0 text-center text-[0.8125rem] leading-6 text-shell-footer-text">
      © {{ currentYear }} Classic Cocktail Cabinet. Built around drinks, bottles, and a shared flavor language.
    </p>
  </footer>
</div>
